plugins {
    id 'com.android.application'
}

android {
    namespace 'uz.ozodbek.hollihop'
    compileSdk 35

    defaultConfig {
        applicationId 'uz.ozodbek.hollihop'
        minSdk 26
        targetSdk 35
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName System.getenv('VERSION_NAME') ?: '1.0.0'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('KEYSTORE_FILE') ?: rootProject.file('keystore/release.jks').path)
            storePassword System.getenv('KEYSTORE_PASSWORD') ?: 'hollihop2026'
            keyAlias System.getenv('KEY_ALIAS') ?: 'hollihop'
            keyPassword System.getenv('KEY_PASSWORD') ?: 'hollihop2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
